<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..800&family=Geist+Mono:wght@400..600&display=block">
<style>
@font-face{font-family:'Redaction 35';font-style:italic;font-weight:400;font-display:block;src:url(../fonts/redaction-35-latin-400-italic.woff2) format('woff2')}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:repeating-linear-gradient(135deg,#141414 0 12px,#2A2A2A 12px 13px);font-family:'Funnel Sans',sans-serif;color:#EDEDED;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0 64px;background:#141414;border-left:1px solid #3A3A3A;border-right:1px solid #3A3A3A;overflow:hidden}
.glow{position:absolute;width:760px;height:760px;right:-260px;bottom:-420px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,54,22,.38),rgba(255,54,22,0))}
.rule{position:absolute;left:0;right:0;height:1px;background:#2E2E2E}
.r1{top:96px}.r2{bottom:96px}
.plus{position:absolute;z-index:2;width:15px;height:15px;margin:-7px 0 0 -7px}
.plus::before,.plus::after{content:"";position:absolute;background:#5A5A5A}
.plus::before{left:7px;top:0;width:1px;height:15px}.plus::after{top:7px;left:0;height:1px;width:15px}
.in{position:absolute;inset:0;padding:0 72px}
.top{position:absolute;top:0;left:72px;right:72px;height:96px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-family:'Funnel Display',sans-serif;font-size:24px;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.mono{font-family:'Geist Mono',monospace;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#A3A3A3}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#66CC64;margin-right:12px;vertical-align:1px;box-shadow:0 0 0 4px rgba(102,204,100,.16)}
h1{position:absolute;left:72px;top:196px;font-family:'Funnel Display',sans-serif;font-weight:400;font-size:112px;line-height:.95;letter-spacing:-.045em}
h1 em{display:block;font-family:'Redaction 35',serif;font-style:italic;letter-spacing:-.02em;font-size:1.08em;line-height:1;margin-top:.04em}
h1 .pt{color:#FF3616}
.bottom{position:absolute;bottom:0;left:72px;right:72px;height:96px;display:flex;align-items:center;justify-content:space-between}
</style></head><body>

  </div>

</body></html>
